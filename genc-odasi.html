<!DOCTYPE html>
<html lang="tr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, minimum-scale=1, maximum-scale=1">
    <title>Genç Odası Koleksiyonu</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;600;700;800&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.css" />

    <style>
        /* --- GENEL AYARLAR --- */
        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            margin: 0;
            font-family: 'Montserrat', sans-serif;
            background: #fff;
            height: 100vh;
            color: #333;
            overflow: hidden;
        }

        /* HEADER */
        .nav-header {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 60px;
            display: flex;
            align-items: center;
            padding: 0 20px;
            z-index: 100;
            background: rgba(255, 255, 255, 0.95);
            border-bottom: 1px solid #eee;
        }

        .back-btn {
            text-decoration: none;
            color: #333;
            font-weight: 700;
            font-size: 0.9rem;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .page-title {
            margin-left: auto;
            font-weight: 800;
            font-size: 1rem;
            color: #111;
            letter-spacing: 1px;
        }

        /* ANA SWIPER */
        .swiper-main {
            width: 100%;
            height: 100%;
            padding-top: 60px;
        }

        /* --- MOBİL İÇİN VARSAYILAN AYARLAR (ALT ALTA) --- */
        .slide-product {
            background: #fff;
            display: block;
            /* Mobilde alt alta olması için block */
            overflow-y: auto;
            /* Sayfa aşağı kaysın */
            height: 100%;
            padding-bottom: 80px;
            /* Alttaki buton için boşluk */
        }

        /* Galeri (Mobil) */
        .gallery-container {
            width: 100%;
            aspect-ratio: 4/3;
            /* Mobilde görsel biraz karemsi olsun */
            background: #f4f4f4;
            position: relative;
        }

        .swiper-gallery {
            width: 100%;
            height: 100%;
        }

        .gallery-img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .swiper-pagination-bullet-active {
            background: #D4AF37 !important;
        }

        /* Bilgi Alanı (Mobil) */
        .info-area {
            padding: 20px 25px;
            background: #fff;
        }

        .product-header {
            margin-bottom: 10px;
            border-bottom: 1px solid #eee;
            padding-bottom: 10px;
        }

        .product-name {
            font-size: 1.5rem;
            font-weight: 800;
            color: #111;
            margin: 0;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .product-desc {
            font-size: 0.9rem;
            color: #555;
            margin-top: 8px;
            line-height: 1.5;
            font-weight: 400;
        }

        .features {
            list-style: none;
            padding: 0;
            margin: 15px 0;
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
        }

        .feature-tag {
            background: #fdfdfd;
            padding: 6px 10px;
            border-radius: 6px;
            font-size: 0.75rem;
            color: #444;
            border: 1px solid #ddd;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .feature-tag i {
            color: #D4AF37;
            font-size: 0.7rem;
        }

        /* Fiyat ve Buton (Mobil) */
        .price-wrapper {
            background: #fafafa;
            border-radius: 10px;
            padding: 15px;
            margin-top: 20px;
            border: 1px solid #eee;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .total-price {
            font-size: 1.4rem;
            font-weight: 800;
            color: #D4AF37;
        }

        .price-label {
            font-size: 0.7rem;
            color: #999;
            display: block;
            font-weight: 700;
        }

        .price-note {
            font-size: 0.7rem;
            color: #e74c3c;
            margin-top: 5px;
            font-style: italic;
            display: block;
            width: 100%;
            text-align: center;
            margin-bottom: 20px;
        }

        .buy-btn {
            background: #25d366;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 50px;
            font-size: 0.9rem;
            font-weight: 700;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 8px;
            text-decoration: none;
            box-shadow: 0 3px 10px rgba(37, 211, 102, 0.3);
            transition: 0.3s;
        }

        .buy-btn:active {
            transform: scale(0.95);
        }


        /* --- MASAÜSTÜ (PC) İÇİN DÜZELTME (YAN YANA) --- */
        @media (min-width: 768px) {
            .swiper-main {
                max-width: 1200px;
                margin: 0 auto;
                border-left: 1px solid #eee;
                border-right: 1px solid #eee;
            }

            /* Block yerine Flex kullan, yan yana diz */
            .slide-product {
                display: flex !important;
                flex-direction: row;
                overflow: hidden;
                /* PC'de sayfa kaymasın, sığsın */
                padding-bottom: 0;
            }

            /* Sol Taraf: Galeri */
            .gallery-container {
                width: 60%;
                height: 100%;
                aspect-ratio: auto;
                /* Kare zorunluluğunu kaldır */
            }

            /* Sağ Taraf: Bilgi */
            .info-area {
                width: 40%;
                height: 100%;
                overflow-y: auto;
                /* Sadece yazı alanı kaysın */
                padding: 40px;
                display: flex;
                flex-direction: column;
            }

            .price-wrapper {
                margin-top: auto;
            }

            /* Fiyatı en alta it */
        }
    </style>
</head>

<body>

    <div class="nav-header">
        <a href="index.html" class="back-btn"><i class="fas fa-chevron-left"></i> MENÜYE DÖN</a>
        <div class="page-title">GENÇ ODALARI</div>
    </div>

    <div class="swiper swiper-main">
        <div class="swiper-wrapper" id="products-container">
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.js"></script>
    <script>
        // ==========================================
        // 🛠️ MODEL VERİLERİ (BURAYI DÜZENLE)
        // ==========================================
        const models = [
            {
                id: 'karamel',
                name: 'KARAMEL',
                imageCount: 6,
                price: '40.000 ₺',
                desc: 'Doğal ahşap dokusu ve modern tasarım.',
                features: ['Aynalı Dolap', 'Çalışma Masası', 'Kitaplık', 'Karyola']
            },
            {
                id: 'isik',
                name: 'IŞIK',
                imageCount: 5,
                price: '40.000 ₺',
                desc: 'Beyazın ferahlatıcı etkisi.',
                features: ['Membran Kapak', 'LED Işıklı Masa', 'Bazalı Karyola']
            },
            {
                id: 'nova',
                name: 'NOVA',
                imageCount: 7,
                price: '40.000 ₺',
                desc: 'Antrasit ve dinamik renkler.',
                features: ['Sürgülü Dolap', 'Oyuncu Masası', 'USB Girişli']
            },
            {
                id: 'asil',
                name: 'ASİL',
                imageCount: 6,
                price: '40.000 ₺',
                desc: 'Country tarzın modern yorumu.',
                features: ['4 Kapılı Dolap', 'Makyaj Masası', 'Lükens Ayak']
            }
        ];

        // ==========================================
        // ⚙️ OTOMATİK OLUŞTURUCU
        // ==========================================
        const container = document.getElementById('products-container');

        models.forEach(model => {
            let slidesHTML = '';
            for (let i = 1; i <= model.imageCount; i++) {
                slidesHTML += `<div class="swiper-slide"><img src="img/genc-odasi/${model.id}-${i}.jpg" class="gallery-img" onerror="this.src='https://placehold.co/600x800?text=Resim+Yok'"></div>`;
            }
            let featuresHTML = model.features.map(f => `<span class="feature-tag"><i class="fas fa-check"></i> ${f}</span>`).join('');

            container.innerHTML += `
                <div class="swiper-slide slide-product">
                    <div class="gallery-container">
                        <div class="swiper swiper-gallery-${model.id}" style="width:100%; height:100%">
                            <div class="swiper-wrapper">${slidesHTML}</div>
                            <div class="swiper-pagination"></div>
                        </div>
                    </div>
                    <div class="info-area">
                        <div class="product-header">
                            <h2 class="product-name">${model.name}</h2>
                            <p class="product-desc">${model.desc}</p>
                            <div class="features">${featuresHTML}</div>
                        </div>
                        
                        <div class="price-wrapper">
                            <div>
                                <span class="price-label">SET FİYATI (PEŞİN)</span>
                                <div class="total-price">${model.price}</div>
                            </div>
                            <a href="#" onclick="orderWhatsapp('${model.name}', '${model.price}')" class="buy-btn">
                                <i class="fab fa-whatsapp"></i> SİPARİŞ
                            </a>
                        </div>
                        <span class="price-note">* Set fiyatıdır. Tekli alımlarda fiyatlar değişmektedir.</span>
                    </div>
                </div>`;
        });

        // SON SLAYT
        container.innerHTML += `<div class="swiper-slide" style="display:flex !important; justify-content:center; align-items:center; text-align:center;"><h3 style="color:#999;">Başka model bulunmamaktadır.</h3><button onclick="mainSwiper.slideTo(0)" style="margin-top:20px; padding:10px 30px; border:1px solid #ccc; background:white; cursor:pointer; border-radius:30px;">BAŞA DÖN</button></div>`;

        var mainSwiper = new Swiper(".swiper-main", { direction: "horizontal", effect: "slide", speed: 600 });

        models.forEach(model => {
            new Swiper(`.swiper-gallery-${model.id}`, { nested: true, direction: "horizontal", pagination: { clickable: true }, loop: true });
        });

        function orderWhatsapp(urun, fiyat) {
            window.open("https://wa.me/905314582416?text=" + encodeURIComponent("Merhaba, " + urun + " hakkında bilgi almak istiyorum."), "_blank");
        }
    </script>
</body>

</html>
