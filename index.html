<!DOCTYPE html>
<html lang="tr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, minimum-scale=1, maximum-scale=1">
    <title>Güney Mobilya | Ana Sayfa</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;600;700;800&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.css" />

    <style>
        /* --- TEMEL AYARLAR --- */
        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            margin: 0;
            padding: 0;
            font-family: 'Montserrat', sans-serif;
            background: #111;
            height: 100vh;
            color: #333;
            overflow: hidden;
        }

        /* ANA SWIPER AYARLARI */
        .swiper-main {
            width: 100%;
            height: 100%;
        }

        .swiper-slide {
            background: #fff;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            width: 100%;
            height: 100%;
        }

        /* --- 1. SLAYT: KAPAK --- */
        .cover-slide {
            background: #111;
            color: white;
            justify-content: center;
            align-items: center;
            text-align: center;
            position: relative;
        }

        .cover-logo {
            width: 70%;
            max-width: 350px;
            margin-bottom: 30px;
        }

        /* KAYDIR İPUCU */
        .swipe-hint {
            position: absolute;
            bottom: 18%;
            opacity: 0.9;
            animation: bounce 2s infinite;
            font-size: 1rem;
            letter-spacing: 1px;
            width: 100%;
            pointer-events: none;
        }

        @keyframes bounce {

            0%,
            20%,
            50%,
            80%,
            100% {
                transform: translateX(0);
            }

            40% {
                transform: translateX(-10px);
            }

            60% {
                transform: translateX(-5px);
            }
        }

        .arrow-right {
            font-size: 2rem;
            display: block;
            margin-top: 15px;
            color: #D4AF37;
        }

        /* EL ANİMASYONU */
        .hand-animation {
            position: absolute;
            top: 55%;
            right: 15%;
            font-size: 3.5rem;
            color: rgba(255, 255, 255, 0.7);
            animation: swipeHand 2.5s ease-in-out infinite;
            opacity: 0;
            pointer-events: none;
        }

        @keyframes swipeHand {
            0% {
                opacity: 0;
                transform: translateX(20px) rotate(15deg);
            }

            20% {
                opacity: 1;
            }

            80% {
                opacity: 1;
                transform: translateX(-60px) rotate(15deg);
            }

            100% {
                opacity: 0;
                transform: translateX(-60px) rotate(15deg);
            }
        }

        /* --- 2. SLAYT: MENÜ --- */
        .menu-slide {
            background: #f4f4f4;
            display: block !important;
            overflow-y: auto;
        }

        /* BANNER ALANI */
        .banner-wrapper {
            width: 100%;
            position: relative;
            background: #f4f4f4;
        }

        .swiper-banner {
            width: 100%;
        }

        .banner-img {
            width: 100%;
            height: auto; 
            display: block;
        }

        /* Banner Noktaları (Pagination) */
        .swiper-pagination-bullet {
            background: #fff;
            opacity: 0.5;
            box-shadow: 0 0 5px rgba(0,0,0,0.5); 
        }

        .swiper-pagination-bullet-active {
            opacity: 1;
            background: #D4AF37;
        }

        /* Grid Alanı */
        .grid-container {
            padding: 20px;
            max-width: 1200px;
            margin: 0 auto;
            padding-bottom: 50px;
        }

        .section-header {
            font-size: 1.5rem;
            font-weight: 800;
            margin: 20px 0;
            color: #111;
            text-align: center;
            letter-spacing: 1px;
        }

        .cat-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 15px;
        }

        /* Kutu Tasarımı */
        .cat-box {
            background: white;
            border-radius: 15px;
            overflow: hidden;
            text-decoration: none;
            color: #333;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.08);
            transition: transform 0.3s;
            position: relative;
            aspect-ratio: 1 / 1;
            display: flex;
            flex-direction: column;
        }

        .cat-box:hover {
            transform: translateY(-5px);
        }

        .cat-box:active {
            transform: scale(0.95);
        }

        .cat-image {
            width: 100%;
            height: 70%;
            object-fit: cover;
        }

        .cat-text {
            height: 30%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            font-size: 0.9rem;
            text-align: center;
            background: white;
            padding: 5px;
            text-transform: uppercase;
        }

        /* --- KURUMSAL BUTON TASARIMI --- */
        .corp-btn-container {
            margin-top: 30px;
            margin-bottom: 20px;
        }

        .corp-link {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: #001540;
            color: white;
            text-decoration: none;
            padding: 20px;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0, 21, 64, 0.2);
            border-left: 5px solid #FF6F00;
            transition: transform 0.2s;
        }

        .corp-link:active {
            transform: scale(0.98);
        }

        .corp-left {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .corp-icon {
            font-size: 1.8rem;
            color: #FF6F00;
        }

        .corp-text {
            display: flex;
            flex-direction: column;
        }

        .corp-main {
            font-weight: 800;
            font-size: 1rem;
            letter-spacing: 1px;
        }

        .corp-sub {
            font-size: 0.75rem;
            opacity: 0.8;
            margin-top: 3px;
        }

        /* PC (Masaüstü) Görünümleri İçin Ayarlar */
        @media (min-width: 768px) {
            .banner-wrapper {
                max-height: 500px;
                overflow: hidden;
                display: flex;
                align-items: center;
            }

            .cat-grid {
                grid-template-columns: repeat(4, 1fr);
                gap: 30px;
            }

            .cat-text {
                font-size: 1.1rem;
            }

            .swipe-hint {
                bottom: 10%;
            }

            /* Pamira bannerını PC'de tamamen gizler */
            .mobile-only-slide {
                display: none !important;
            }
        }
    </style>
</head>

<body>

    <div class="swiper swiper-main">
        <div class="swiper-wrapper">

            <div class="swiper-slide cover-slide">
                <img src="img/logo.png" alt="Güney Mobilya" class="cover-logo">
                <h2 style="font-weight: 300; letter-spacing: 4px; font-size: 1.4rem;">2026 KOLEKSİYONU</h2>

                <div class="swipe-hint">
                    MENÜ İÇİN KAYDIRIN <br>
                    <i class="fas fa-chevron-right arrow-right"></i>
                </div>

                <div class="hand-animation">
                    <i class="far fa-hand-pointer"></i>
                </div>
            </div>

            <div class="swiper-slide menu-slide">

                <div class="banner-wrapper">
                    <div class="swiper swiper-banner">
                        <div class="swiper-wrapper">

                            <div class="swiper-slide mobile-only-slide">
                                <a href="baza-yatak.html#pamira">
    <img src="img/Yaz_Fırsatı_Pamira.jpg" class="banner-img" alt="Pamira Yaz Fırsatı">
</a>
                            </div>

                            <div class="swiper-slide">
                                <picture>
                                    <source media="(min-width: 768px)" srcset="img/firsat1-pc.jpg">
                                    <img src="img/firsat1-mobil.jpg" class="banner-img" alt="Fırsat Ürünü">
                                </picture>
                            </div>

                            <div class="swiper-slide">
                                <picture>
                                    <source media="(min-width: 768px)" srcset="img/Eko_Banner_PC.jpg">
                                    <img src="img/Eko_Banner_Mobil.jpg" class="banner-img" alt="Ekonomik Paket">
                                </picture>
                            </div>

                        </div>
                        <div class="swiper-pagination"></div>
                    </div>
                </div>

                <div class="grid-container">
                    <div class="section-header">ÜRÜN GRUPLARI</div>

                    <div class="cat-grid">

                        <a href="baza-yatak.html" class="cat-box">
                            <img src="img/havuzlu_bubble.jpg" class="cat-image" alt="Baza Yatak">
                            <div class="cat-text">BAZA & YATAK</div>
                        </a>

                        <a href="genc-odasi.html" class="cat-box">
                            <img src="img/genc-odasi/nova-4.jpg" class="cat-image" alt="Genç Odası"
                                onerror="this.src='img/genc_odasi_placeholder.jpg'">
                            <div class="cat-text">GENÇ ODASI</div>
                        </a>

                        <a href="yatak-odasi.html" class="cat-box">
                            <img src="img/yatak-odasi/balat-1.jpg"
                                onerror="this.src='https://placehold.co/400x400/eee/999?text=Yatak+Odasi'"
                                class="cat-image" alt="Yatak Odası">
                            <div class="cat-text">YATAK ODASI</div>
                        </a>

                        <a href="oturma-grubu.html" class="cat-box">
                            <img src="img/koltuk-kapak.jpg"
                                onerror="this.src='https://placehold.co/400x400/eee/999?text=Oturma+Grubu'"
                                class="cat-image" alt="Oturma Grubu">
                            <div class="cat-text">OTURMA GRUBU</div>
                        </a>
                    </div>

                    <div class="corp-btn-container">
                        <a href="kurumsal.html" class="corp-link">
                            <div class="corp-left">
                                <i class="fas fa-hotel corp-icon"></i>
                                <div class="corp-text">
                                    <span class="corp-main">KURUMSAL PROJELER</span>
                                    <span class="corp-sub">Otel, Yurt ve Toplu Alım Çözümleri</span>
                                </div>
                            </div>
                            <i class="fas fa-chevron-right" style="color:white"></i>
                        </a>
                    </div>

                    <div
                        style="text-align:center; margin-top:30px; color:#aaa; font-size:0.8rem; padding-bottom: 20px;">
                        &copy; 2026 GÜNEY MOBİLYA<br>
                        Siteler / ANKARA
                    </div>
                </div>

            </div>

        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.js"></script>
    <script>
        var mainSwiper = new Swiper(".swiper-main", {
            direction: "horizontal",
            effect: "slide",
            speed: 600,
            grabCursor: true
        });

        var bannerSwiper = new Swiper(".swiper-banner", {
            loop: true, 
            observer: true,       // Gizli slaytların Swiper'ı bozmaması için
            observeParents: true, // Ebeveyn değişikliklerini izlemesi için
            autoplay: {
                delay: 4500, 
                disableOnInteraction: false,
            },
            pagination: {
                el: ".swiper-pagination",
                clickable: true,
            },
            nested: true 
        });
    </script>
</body>

</html>
